name: PoolX API 深度探测
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行探测
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
        run: |
          cat > probe_poolx.py <<'PY'
          import json, hmac, hashlib, base64, time, urllib.request, urllib.error, ssl, os
          from urllib.parse import urlencode

          API_KEY = os.environ["BITGET_API_KEY"]
          API_SECRET = os.environ["BITGET_API_SECRET"]
          PASSPHRASE = os.environ["BITGET_API_PASSPHRASE"]
          BASE = "https://api.bitget.com"
          ctx = ssl.create_default_context()

          def sign(ts, method, path, body=""):
              msg = ts + method.upper() + path + body
              return base64.b64encode(hmac.new(API_SECRET.encode(), msg.encode(), hashlib.sha256).digest()).decode()

          def req(method, path, params=None, body_str=""):
              qs = urlencode(params) if params else ""
              full_path = path + ("?" + qs if qs else "")
              ts = str(int(time.time() * 1000))
              sig = sign(ts, method, full_path, body_str)
              headers = {"ACCESS-KEY": API_KEY, "ACCESS-SIGN": sig, "ACCESS-TIMESTAMP": ts,
                         "ACCESS-PASSPHRASE": PASSPHRASE, "Content-Type": "application/json"}
              try:
                  r = urllib.request.Request(BASE + full_path, data=body_str.encode() if body_str else None,
                                              headers=headers, method=method.upper())
                  with urllib.request.urlopen(r, context=ctx, timeout=15) as resp:
                      data = resp.read().decode()
                      try: return resp.status, json.loads(data)
                      except: return resp.status, data[:300]
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:300]
                  try: return e.code, json.loads(body)
                  except: return e.code, body
              except Exception as e:
                  return -1, str(e)[:100]

          def show(label, code, data):
              if isinstance(data, dict):
                  msg = data.get("msg", "")
                  d = data.get("data", "")
                  if isinstance(d, list) and d:
                      print(f"  [HIT] {label} -> {code}, {len(d)} items: {json.dumps(d[0], ensure_ascii=False)[:120]}")
                  elif code == 404:
                      print(f"  [404] {label}")
                  elif "不支持" in str(msg) or "UTA" in str(msg):
                      print(f"  [UTA] {label} -> {code}, {msg[:80]}")
                  else:
                      print(f"  [{code}] {label} -> msg={msg[:60]}, data={str(d)[:80]}")
              else:
                  print(f"  [{code}] {label} -> {str(data)[:80]}")

          # 组1: earn/account/assets 加查询参数
          print("=== 组1: earn/account/assets 加参数 ===")
          for p in [None, {"productType":"poolx"}, {"productType":"POOLX"}, {"type":"poolx"},
                    {"productType":"lock"}, {"productType":"staking"}, {"productType":"launchpool"},
                    {"productType":"all"}, {"productType":"0"}, {"productType":"1"}, {"productType":"2"},
                    {"productType":"3"}, {"productType":"4"}, {"productType":"5"}]:
              show(str(p), *req("GET", "/api/v2/earn/account/assets", p))

          # 组2: v3 earn 端点
          print("\n=== 组2: v3 earn 端点 ===")
          for ep in ["/api/v3/earn/account/assets","/api/v3/earn/savings/assets","/api/v3/earn/poolx/assets",
                     "/api/v3/earn/poolx/holdings","/api/v3/earn/poolx/positions","/api/v3/earn/staking/assets",
                     "/api/v3/earn/staking/positions","/api/v3/earn/lock/assets","/api/v3/earn/launchpool/assets",
                     "/api/v3/earn/elite-assets","/api/v3/earn/elite-product","/api/v3/earn/shark-fin/assets",
                     "/api/v3/earn/all-assets","/api/v3/earn/products","/api/v3/earn/orders",
                     "/api/v3/earn/subscribe-records","/api/v3/account/earn-assets","/api/v3/account/all-assets",
                     "/api/v3/earn/poolx/account-assets","/api/v3/earn/poolx/records","/api/v3/earn/poolx/orders"]:
              show(ep, *req("GET", ep))

          # 组3: v2 更多路径
          print("\n=== 组3: v2 更多路径 ===")
          for ep in ["/api/v2/earn/poolx/account-assets","/api/v2/earn/poolx/assets","/api/v2/earn/poolx/holdings",
                     "/api/v2/earn/poolx/positions","/api/v2/earn/poolx/orders","/api/v2/earn/poolx/records",
                     "/api/v2/earn/launchpool/assets","/api/v2/earn/launchpool/holdings","/api/v2/earn/staking/assets",
                     "/api/v2/earn/staking/holdings","/api/v2/earn/lock/assets","/api/v2/earn/lock/holdings",
                     "/api/v2/earn/shark-fin/assets","/api/v2/earn/all-account-assets","/api/v2/earn/all-assets",
                     "/api/v2/earn/products","/api/v2/earn/orders","/api/v2/account/earn-assets",
                     "/api/v2/account/poolx-assets","/api/v2/wallet/earn-assets","/api/v2/wallet/poolx-assets",
                     "/api/v2/spot/earn-assets","/api/v2/earn/savings/account-assets","/api/v2/earn/account/all-assets"]:
              show(ep, *req("GET", ep))

          # 组4: all-account-balance 加参数
          print("\n=== 组4: all-account-balance 加参数 ===")
          for p in [None, {"accountType":"earn"}, {"accountType":"poolx"}, {"accountType":"all"}]:
              show(str(p), *req("GET", "/api/v2/account/all-account-balance", p))

          print("\n=== 探测完成 ===")
          PY
          python3 probe_poolx.py
