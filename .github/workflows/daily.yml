name: 每日资产统计与 Pages 部署

# 每天 UTC 00:10（北京时间 08:10）自动抓取一次；也支持手动触发（Actions 页面点 Run workflow）。
# 手动触发时可选择性填写 PoolX 字段，实现表单式更新 PoolX 持仓（无需改 JSON）。
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      poolx_coin:
        description: "单币种填代码（如 BTC），配合下方数量；多币种一次填 COIN:数量,COIN:数量（如 BTC:0.0717,SOL:43.6876）；删除多币种填 BTC,SOL；留空则不更新"
        required: false
        type: string
      poolx_amount:
        description: "单币种模式的锁仓数量（如 0.0717）；多币种模式忽略此框"
        required: false
        type: string
      poolx_action:
        description: "操作类型：update=新增或覆盖，remove=删除"
        required: false
        type: choice
        options:
          - update
          - remove
        default: update

permissions:
  contents: write   # 提交 data/history.json 和 data/poolx_manual.json
  pages: write      # 部署 GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.output.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 可选：表单式更新 PoolX 手动持仓（仅在填写了 poolx_coin 时执行）
      - name: 更新 PoolX 手动持仓（可选）
        if: ${{ inputs.poolx_coin != '' }}
        env:
          POOLX_COIN: ${{ inputs.poolx_coin }}
          POOLX_AMOUNT: ${{ inputs.poolx_amount }}
          POOLX_ACTION: ${{ inputs.poolx_action }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          coin_raw = os.environ.get("POOLX_COIN", "").strip()
          amount = os.environ.get("POOLX_AMOUNT", "").strip()
          action = os.environ.get("POOLX_ACTION", "update").strip()
          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")

          if not coin_raw:
              print("未提供币种，跳过")
              raise SystemExit(0)

          # 自动识别格式：
          #   多币种: COIN:AMOUNT,COIN:AMOUNT  （删除时可只写 COIN,COIN）
          #   单币种: COIN（数量从单独输入框取）
          entries = []
          if "," in coin_raw or ":" in coin_raw:
              for part in coin_raw.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  segs = part.split(":")
                  c = segs[0].strip().upper()
                  a = segs[1].strip() if len(segs) > 1 else ""
                  entries.append((c, a))
              print(f"识别到多币种模式，共 {len(entries)} 个")
          else:
              entries.append((coin_raw.upper(), amount))

          path = Path("data/poolx_manual.json")
          data = json.loads(path.read_text()) if path.exists() else {}

          for c, a in entries:
              if action == "remove":
                  if c in data:
                      del data[c]
                      print(f"已删除 {c}")
                  else:
                      print(f"{c} 不存在，无需删除")
              else:
                  if not a:
                      print(f"错误：{c} 的 update 操作必须提供数量")
                      raise SystemExit(1)
                  data[c] = {"amount": float(a), "updated": today}
                  print(f"已更新 {c}: amount={a}, updated={today}")

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print("data/poolx_manual.json 已写入")
          PY

      # 密钥全部来自仓库 Secrets，不进入代码仓库
      - name: 抓取资产与盈亏
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python fetch_pnl.py

      - name: 提交历史数据与 PoolX 配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/poolx_manual.json
          git commit -m "chore: 更新 $(date +%F) 资产快照与 PoolX 配置" || echo "无数据变更，跳过提交"
          git push

      - name: 组装站点文件
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/history.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
