name: 每日资产统计与 Pages 部署

# 每天 UTC 00:10（北京时间 08:10）自动抓取一次；也支持手动触发（Actions 页面点 Run workflow）。
# 手动触发时可选择性填写 PoolX 字段或内部划转字段，实现表单式更新（无需改 JSON）。
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      poolx_coin:
        description: "单币种填代码（如 BTC），配合下方数量；多币种一次填 COIN:数量,COIN:数量（如 BTC:0.0717,SOL:43.6876）；删除多币种填 BTC,SOL；留空则不更新"
        required: false
        type: string
      poolx_amount:
        description: "单币种模式的锁仓数量（如 0.0717）；多币种模式忽略此框"
        required: false
        type: string
      poolx_action:
        description: "操作类型：update=新增或覆盖，remove=删除"
        required: false
        type: choice
        options:
          - update
          - remove
        default: update
      flow_outflow_usdt:
        description: "今日手动划出（USDT），如转到美股账户；留空则不记录"
        required: false
        type: string
      flow_inflow_usdt:
        description: "今日手动划入（USDT），如从美股账户转回；留空则不记录"
        required: false
        type: string
      flow_note:
        description: "划转备注（如 转美股），可选"
        required: false
        type: string

permissions:
  contents: write   # 提交 data/history.json 和 data/poolx_manual.json
  pages: write      # 部署 GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.output.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 可选：表单式更新 PoolX 手动持仓（仅在填写了 poolx_coin 时执行）
      - name: 更新 PoolX 手动持仓（可选）
        if: ${{ inputs.poolx_coin != '' }}
        env:
          POOLX_COIN: ${{ inputs.poolx_coin }}
          POOLX_AMOUNT: ${{ inputs.poolx_amount }}
          POOLX_ACTION: ${{ inputs.poolx_action }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          coin_raw = os.environ.get("POOLX_COIN", "").strip()
          amount = os.environ.get("POOLX_AMOUNT", "").strip()
          action = os.environ.get("POOLX_ACTION", "update").strip()
          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")

          if not coin_raw:
              print("未提供币种，跳过")
              raise SystemExit(0)

          # 自动识别格式：
          #   多币种: COIN:AMOUNT,COIN:AMOUNT  （删除时可只写 COIN,COIN）
          #   单币种: COIN（数量从单独输入框取）
          entries = []
          if "," in coin_raw or ":" in coin_raw:
              for part in coin_raw.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  segs = part.split(":")
                  c = segs[0].strip().upper()
                  a = segs[1].strip() if len(segs) > 1 else ""
                  entries.append((c, a))
              print(f"识别到多币种模式，共 {len(entries)} 个")
          else:
              entries.append((coin_raw.upper(), amount))

          path = Path("data/poolx_manual.json")
          data = json.loads(path.read_text()) if path.exists() else {}

          for c, a in entries:
              if action == "remove":
                  if c in data:
                      del data[c]
                      print(f"已删除 {c}")
                  else:
                      print(f"{c} 不存在，无需删除")
              else:
                  if not a:
                      print(f"错误：{c} 的 update 操作必须提供数量")
                      raise SystemExit(1)
                  data[c] = {"amount": float(a), "updated": today}
                  print(f"已更新 {c}: amount={a}, updated={today}")

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print("data/poolx_manual.json 已写入")
          PY

      # 可选：记录今日手动内部划转（如转美股账户），并入当日出入金
      - name: 记录手动内部划转（可选）
        if: ${{ inputs.flow_outflow_usdt != '' || inputs.flow_inflow_usdt != '' }}
        env:
          FLOW_OUTFLOW: ${{ inputs.flow_outflow_usdt }}
          FLOW_INFLOW: ${{ inputs.flow_inflow_usdt }}
          FLOW_NOTE: ${{ inputs.flow_note }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
          out_s = os.environ.get("FLOW_OUTFLOW", "").strip()
          in_s = os.environ.get("FLOW_INFLOW", "").strip()
          note = os.environ.get("FLOW_NOTE", "").strip()

          path = Path("data/manual_flow.json")
          data = json.loads(path.read_text()) if path.exists() else {}
          entry = {
              "outflow_usdt": float(out_s) if out_s else 0.0,
              "inflow_usdt": float(in_s) if in_s else 0.0,
          }
          if note:
              entry["note"] = note
          data[today] = entry
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print(f"已记录 {today} 手动划转: 出 {entry['outflow_usdt']} / 入 {entry['inflow_usdt']} USDT"
                + (f"（{note}）" if note else ""))
          PY

      # 密钥全部来自仓库 Secrets，不进入代码仓库
      - name: 抓取资产与盈亏
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python fetch_pnl.py

      - name: 提交历史数据与配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/poolx_manual.json data/manual_flow.json
          git commit -m "chore: 更新 $(date +%F) 资产快照与配置" || echo "无数据变更，跳过提交"
          git push

      - name: 组装站点文件
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/history.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Pages 部署完成后再发 Bark，确保用户点通知时仪表盘已是最新数据
      - name: Bark 推送资产日报
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          bark_key = os.environ.get("BARK_KEY", "").strip().rstrip("/")
          if not bark_key:
              print("未配置 BARK_KEY，跳过推送")
              raise SystemExit(0)
          url = bark_key if bark_key.startswith("http") else f"https://api.day.app/{bark_key}"

          hist = json.loads(Path("data/history.json").read_text())
          snap = hist[-1]
          daily = snap.get("dailyChangeUsdt", 0) or 0
          cum = snap.get("cumChangeUsdt", 0) or 0
          net_flow = snap.get("netFlowUsdt", 0) or 0
          dep = snap.get("depositUsdt", 0) or 0
          wit = snap.get("withdrawUsdt", 0) or 0
          spot = snap.get("spotUsdt", 0) or 0
          earn = snap.get("earnUsdt", 0) or 0
          poolx = snap.get("poolx", {}) or {}
          poolx_str = ", ".join(f"{c} {a:g}" for c, a in sorted(poolx.items())) if poolx else "无"
          mf = snap.get("manualFlow", {}) or {}
          mf_out = mf.get("outflow_usdt", 0) or 0
          mf_in = mf.get("inflow_usdt", 0) or 0
          mf_note = mf.get("note", "") or ""

          lines = [
              f"总资产: {snap['totalUsdt']:,.2f} USDT",
              f"今日盈亏: {daily:+.2f} USDT",
              f"总盈亏: {cum:+.2f} USDT",
              f"净出入金: {net_flow:+.2f}（充入 {dep:.2f} / 提出 {wit:.2f}）",
          ]
          if mf_out > 0 or mf_in > 0:
              lines.append(f"手动出入金: 出 {mf_out:.2f} / 入 {mf_in:.2f}" + (f"（{mf_note}）" if mf_note else ""))
          lines.append(f"现货: {spot:,.2f} / 理财: {earn:,.2f}")
          lines.append(f"PoolX: {poolx_str}")
          body = "\n".join(lines)

          payload = {
              "title": f"Bitget 资产日报 · {snap['date']}",
              "body": body,
              "group": "bitget-pnl",
              "level": "active",
              "sound": "minuet",
              "url": "https://978912280-jpg.github.io/bitget-pnl-dashboard/",
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                        headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"[bark] 推送成功 ✅ (HTTP {r.status})")
          except Exception as e:
              print(f"[bark] 推送失败: {e}")
          PY
